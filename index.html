<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252525">
  <title>MPM.me - Black Screen</title>
  <meta name="description" content="A browser-based monitor blackout tool.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #252525;
      color: #f4f4f2;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 20rem;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 15%, #353535 0, #292929 35%, #222 100%);
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2rem 1.25rem;
    }

    .panel {
      width: min(100%, 34rem);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #aaa;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 13vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -.065em;
      line-height: .9;
    }

    .subtitle {
      margin: 1rem 0 2.25rem;
      color: #bdbdb9;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
    }

    .go-black {
      display: inline-flex;
      align-items: center;
      gap: .8rem;
      min-height: 3.75rem;
      padding: .75rem 1.4rem;
      border: 1px solid #606060;
      border-radius: .9rem;
      background: #f1f1ed;
      color: #151515;
      font-size: 1.1rem;
      font-weight: 750;
      box-shadow: 0 .8rem 2.5rem rgb(0 0 0 / 25%);
    }

    .go-black::before {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: .25rem;
      background: #050505;
      content: "";
    }

    .go-black:hover { background: #fff; }
    .go-black:active { transform: translateY(1px); }

    .settings {
      margin-top: 2.25rem;
      padding: 1.25rem;
      border: 1px solid #454545;
      border-radius: 1rem;
      background: rgb(25 25 25 / 52%);
      text-align: left;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .toggle-copy strong,
    .toggle-copy span { display: block; }

    .toggle-copy span {
      margin-top: .2rem;
      color: #999;
      font-size: .85rem;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 3rem;
      height: 1.7rem;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch span {
      position: absolute;
      inset: 0;
      border: 1px solid #666;
      border-radius: 999px;
      background: #333;
      transition: background .15s ease;
    }

    .switch span::after {
      position: absolute;
      top: .2rem;
      left: .2rem;
      width: 1.18rem;
      height: 1.18rem;
      border-radius: 50%;
      background: #bbb;
      content: "";
      transition: transform .15s ease, background .15s ease;
    }

    .switch input:checked + span { background: #e7e7e2; }
    .switch input:checked + span::after {
      background: #111;
      transform: translateX(1.3rem);
    }

    .switch input:focus-visible + span,
    :focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .timer-settings {
      margin: 1.25rem 0 0;
      padding: 1.25rem 0 0;
      border: 0;
      border-top: 1px solid #414141;
    }

    .timer-settings[hidden],
    .custom-time[hidden] { display: none; }

    .timer-settings legend {
      padding: 0;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
      margin-top: .75rem;
    }

    .preset { position: relative; }

    .preset input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .preset span {
      display: grid;
      min-height: 2.65rem;
      place-items: center;
      padding: .5rem;
      border: 1px solid #505050;
      border-radius: .55rem;
      color: #bbb;
      font-size: .82rem;
      text-align: center;
    }

    .preset input:checked + span {
      border-color: #eee;
      background: #e8e8e4;
      color: #151515;
      font-weight: 700;
    }

    .preset input:focus-visible + span {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .custom-time {
      display: flex;
      justify-content: center;
      gap: .75rem;
      margin-top: 1rem;
    }

    .number-field {
      display: grid;
      gap: .35rem;
      color: #aaa;
      font-size: .75rem;
    }

    .number-field input {
      width: 6rem;
      padding: .7rem;
      border: 1px solid #555;
      border-radius: .5rem;
      background: #1e1e1e;
      color: #fff;
    }

    .hint {
      margin: 1.25rem 0 0;
      color: #8f8f8b;
      font-size: .82rem;
      line-height: 1.5;
    }

    .status {
      min-height: 1.4rem;
      margin: 1rem 0 0;
      color: #e2b6b6;
      font-size: .88rem;
    }

    .blackout {
      position: fixed;
      z-index: 10;
      display: none;
      grid-template-rows: 1fr auto 1fr;
      gap: clamp(1.25rem, 4vh, 3rem);
      overflow: hidden;
      padding: clamp(1rem, 5vh, 4rem) 1rem;
      background: #000;
      cursor: default;
      inset: 0;
    }

    .is-blackout .shell { display: none; }
    .is-blackout .blackout { display: grid; place-items: center; }
    .is-blackout.pointer-idle .blackout { cursor: none; }

    .blackout-timer {
      align-self: end;
      grid-row: 1;
      color: #262626;
      font-size: clamp(4rem, 17vw, 11rem);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
      user-select: none;
      white-space: nowrap;
    }

    .prompt-visible .blackout-timer { opacity: 1; }
    .blackout-timer[hidden] { display: none; }

    .exit-prompt {
      z-index: 1;
      align-self: start;
      grid-row: 2;
      width: min(calc(100% - 2rem), 24rem);
      padding: 1.4rem;
      border: 1px solid #4a4a4a;
      border-radius: .9rem;
      background: #111;
      color: #eee;
      box-shadow: 0 1.2rem 4rem rgb(0 0 0 / 75%);
      text-align: center;
    }

    .exit-prompt[hidden] { display: none; }
    .exit-prompt h2 { margin: 0; font-size: 1.15rem; }
    .exit-prompt p {
      margin: .55rem 0 1.1rem;
      color: #999;
      font-size: .88rem;
      line-height: 1.45;
    }

    .prompt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .65rem;
    }

    .prompt-actions button {
      min-height: 2.85rem;
      border: 1px solid #444;
      border-radius: .55rem;
      background: #222;
      color: #ddd;
      font-weight: 700;
    }

    .prompt-actions .exit-button {
      border-color: #ddd;
      background: #eee;
      color: #111;
    }

    @media (max-width: 30rem) {
      .presets { grid-template-columns: repeat(2, 1fr); }
      .settings { padding: 1rem; }
      .prompt-actions { grid-template-columns: 1fr; }
    }

    @media (max-height: 34rem) {
      .blackout { gap: .75rem; padding-block: .75rem; }
      .blackout-timer { font-size: clamp(3rem, 17vh, 5rem); }
      .exit-prompt { padding: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="title">
      <p class="eyebrow">Monitor utility</p>
      <h1 id="title">Black<br>Screen</h1>
      <p class="subtitle">A browser-based monitor blackout tool.</p>

      <button class="go-black" id="goBlack" type="button">Go Black</button>

      <section class="settings" aria-label="Blackout settings">
        <div class="toggle-row">
          <label class="toggle-copy" for="timerEnabled">
            <strong>Set an exit timer</strong>
            <span>Return automatically after a chosen duration.</span>
          </label>
          <label class="switch" aria-label="Set an exit timer">
            <input id="timerEnabled" type="checkbox">
            <span aria-hidden="true"></span>
          </label>
        </div>

        <fieldset class="timer-settings" id="timerSettings" hidden>
          <legend>Blackout duration</legend>
          <div class="presets">
            <label class="preset"><input type="radio" name="duration" value="10" checked><span>10 min</span></label>
            <label class="preset"><input type="radio" name="duration" value="30"><span>30 min</span></label>
            <label class="preset"><input type="radio" name="duration" value="60"><span>1 hour</span></label>
            <label class="preset"><input type="radio" name="duration" value="custom"><span>Custom</span></label>
          </div>

          <div class="custom-time" id="customTime" hidden>
            <label class="number-field">Hours
              <input id="hours" type="number" min="0" max="24" value="0" inputmode="numeric">
            </label>
            <label class="number-field">Minutes
              <input id="minutes" type="number" min="0" max="59" value="10" inputmode="numeric">
            </label>
          </div>
        </fieldset>

        <p class="hint">While blacked out, click anywhere to reveal the timer and exit controls.</p>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <section class="blackout" id="blackout" tabindex="-1" aria-label="Blackout screen">
    <div class="blackout-timer" id="blackoutTimer" aria-hidden="true" hidden>10:00</div>
    <div class="exit-prompt" id="exitPrompt" role="dialog" aria-modal="true" aria-labelledby="exitTitle" hidden>
      <h2 id="exitTitle">Exit Black Screen?</h2>
      <p>Select exit or press <strong>F</strong>. Dismiss to return to complete black.</p>
      <div class="prompt-actions">
        <button class="exit-button" id="exitButton" type="button">Exit Fullscreen</button>
        <button id="dismissButton" type="button">Dismiss</button>
      </div>
    </div>
  </section>

  <script>
    const storageKey = "black-screen-settings";
    const body = document.body;
    const goBlack = document.querySelector("#goBlack");
    const timerEnabled = document.querySelector("#timerEnabled");
    const timerSettings = document.querySelector("#timerSettings");
    const customTime = document.querySelector("#customTime");
    const hours = document.querySelector("#hours");
    const minutes = document.querySelector("#minutes");
    const status = document.querySelector("#status");
    const blackout = document.querySelector("#blackout");
    const blackoutTimer = document.querySelector("#blackoutTimer");
    const exitPrompt = document.querySelector("#exitPrompt");
    const exitButton = document.querySelector("#exitButton");
    const dismissButton = document.querySelector("#dismissButton");

    let endTime = 0;
    let timerId = 0;
    let pointerId = 0;
    let promptOpen = false;
    let starting = false;

    function selectedDuration() {
      return document.querySelector('input[name="duration"]:checked');
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (!saved || typeof saved !== "object") return;

        timerEnabled.checked = saved.enabled === true;
        const validPreset = ["10", "30", "60", "custom"].includes(saved.mode);
        const mode = validPreset ? saved.mode : "10";
        document.querySelector(`input[name="duration"][value="${mode}"]`).checked = true;

        const savedHours = Number(saved.hours);
        const savedMinutes = Number(saved.minutes);
        hours.value = Number.isInteger(savedHours) && savedHours >= 0 && savedHours <= 24 ? savedHours : 0;
        minutes.value = Number.isInteger(savedMinutes) && savedMinutes >= 0 && savedMinutes <= 59 ? savedMinutes : 10;
        const total = Number(hours.value) * 60 + Number(minutes.value);
        if (mode === "custom" && (total < 1 || total > 1440)) {
          hours.value = 0;
          minutes.value = 10;
        }
      } catch {
        // Storage can be unavailable in private or restricted browsing modes.
      }
    }

    function saveSettings() {
      const settings = {
        enabled: timerEnabled.checked,
        mode: selectedDuration().value,
        hours: Number(hours.value),
        minutes: Number(minutes.value)
      };
      try { localStorage.setItem(storageKey, JSON.stringify(settings)); }
      catch { /* Preferences remain available for the current page load. */ }
    }

    function syncSettings() {
      const custom = selectedDuration().value === "custom";
      timerSettings.hidden = !timerEnabled.checked;
      customTime.hidden = !custom;
    }

    function durationInMinutes() {
      const mode = selectedDuration().value;
      if (mode !== "custom") return Number(mode);

      const hourValue = Number(hours.value);
      const minuteValue = Number(minutes.value);
      const valid = Number.isInteger(hourValue) && Number.isInteger(minuteValue)
        && hourValue >= 0 && hourValue <= 24
        && minuteValue >= 0 && minuteValue <= 59;
      const total = hourValue * 60 + minuteValue;
      return valid && total >= 1 && total <= 1440 ? total : 0;
    }

    function formatTime(milliseconds) {
      const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
    }

    function updateTimer() {
      const remaining = endTime - Date.now();
      blackoutTimer.textContent = formatTime(remaining);
      if (remaining <= 0) {
        window.clearInterval(timerId);
        timerId = 0;
        status.textContent = "Timer complete.";
        leaveFullscreen();
      }
    }

    function startBlackout(duration) {
      body.classList.add("is-blackout");
      blackoutTimer.hidden = !timerEnabled.checked;
      dismissPrompt();
      blackout.focus();

      if (timerEnabled.checked) {
        endTime = Date.now() + duration * 60_000;
        updateTimer();
        timerId = window.setInterval(updateTimer, 250);
      }
      resetPointerIdle();
    }

    function cleanupBlackout() {
      window.clearInterval(timerId);
      window.clearTimeout(pointerId);
      timerId = 0;
      pointerId = 0;
      endTime = 0;
      promptOpen = false;
      exitPrompt.hidden = true;
      blackoutTimer.hidden = true;
      blackout.classList.remove("prompt-visible");
      body.classList.remove("is-blackout", "pointer-idle");
      goBlack.focus({ preventScroll: true });
    }

    function showPrompt() {
      promptOpen = true;
      body.classList.remove("pointer-idle");
      blackout.classList.add("prompt-visible");
      exitPrompt.hidden = false;
      exitButton.focus({ preventScroll: true });
    }

    function dismissPrompt() {
      promptOpen = false;
      exitPrompt.hidden = true;
      blackout.classList.remove("prompt-visible");
      if (body.classList.contains("is-blackout")) blackout.focus({ preventScroll: true });
    }

    function resetPointerIdle() {
      body.classList.remove("pointer-idle");
      window.clearTimeout(pointerId);
      if (!promptOpen) pointerId = window.setTimeout(() => body.classList.add("pointer-idle"), 1800);
    }

    async function leaveFullscreen() {
      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); }
        catch { cleanupBlackout(); }
      } else {
        cleanupBlackout();
      }
    }

    async function enterFullscreen() {
      status.textContent = "";
      const duration = durationInMinutes();
      if (timerEnabled.checked && !duration) {
        status.textContent = "Choose a duration between 1 minute and 24 hours.";
        return;
      }
      if (!document.documentElement.requestFullscreen) {
        status.textContent = "Fullscreen is not supported by this browser.";
        return;
      }

      starting = true;
      try {
        await document.documentElement.requestFullscreen();
        if (!body.classList.contains("is-blackout")) startBlackout(duration);
      } catch {
        status.textContent = "Fullscreen could not be started. Check browser permissions and try again.";
      } finally {
        starting = false;
      }
    }

    timerEnabled.addEventListener("change", () => {
      syncSettings();
      saveSettings();
    });

    document.querySelectorAll('input[name="duration"]').forEach(input => {
      input.addEventListener("change", () => {
        syncSettings();
        saveSettings();
      });
    });

    [hours, minutes].forEach(input => input.addEventListener("change", saveSettings));
    goBlack.addEventListener("click", enterFullscreen);
    exitButton.addEventListener("click", leaveFullscreen);
    dismissButton.addEventListener("click", dismissPrompt);

    blackout.addEventListener("click", event => {
      if (exitPrompt.contains(event.target)) return;
      if (promptOpen) dismissPrompt();
      else showPrompt();
    });

    blackout.addEventListener("pointermove", resetPointerIdle);

    document.addEventListener("keydown", event => {
      if (promptOpen && event.key.toLowerCase() === "f") {
        event.preventDefault();
        leaveFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) cleanupBlackout();
      else if (starting && !body.classList.contains("is-blackout")) startBlackout(durationInMinutes());
    });

    loadSettings();
    syncSettings();
  </script>
</body>
</html>
